version: 2
updates:
  # Python dependencies are hash-locked across supported runtimes and are
  # regenerated as a tested release unit. Repository-level Dependabot alerts
  # and CI pip-audit checks remain enabled for vulnerability detection.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Python minor-version jumps are runtime migrations, not routine image
    # maintenance. Patch updates remain eligible for automated review.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
